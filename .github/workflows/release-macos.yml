name: Mac release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
    paths:
      - '.github/workflows/release-macos.yml'
  create:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as 1.1.0 or v1.1.0
        required: true

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      - name: Select release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == branch ]]; then
            tag=$(git tag --merged HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            if [[ -z "$tag" ]]; then
              echo "No version tag to release."
              exit 0
            fi
            app_version=$(awk '/MARKETING_VERSION = / { gsub(/;/, "", $3); print $3; exit }' Plainwire.xcodeproj/project.pbxproj)
            if [[ ${tag#v} != "$app_version" ]]; then
              echo "App version $app_version is awaiting its matching tag."
              exit 0
            fi
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)
            if grep -Fxq 'Plainwire-macOS-universal.zip' <<< "$assets" &&
               grep -Fxq 'SHA256SUMS.txt' <<< "$assets" &&
               grep -Fxq 'install-macos.sh' <<< "$assets" &&
               grep -Fxq 'update-macos.sh' <<< "$assets" &&
               grep -Fxq 'plainwire-swap' <<< "$assets"; then
              echo "Release $tag already has its install assets."
              exit 0
            fi
          elif [[ "$GITHUB_EVENT_NAME" == create ]]; then
            [[ "$GITHUB_REF_TYPE" == tag ]] || exit 0
            tag=$GITHUB_REF_NAME
          elif [[ "$GITHUB_EVENT_NAME" == release ]]; then
            tag=$RELEASE_EVENT_TAG
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag=$REQUESTED_TAG
          else
            tag=$GITHUB_REF_NAME
          fi

          if [[ ! $tag =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like 1.2.3 or v1.2.3: $tag" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$tag" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"

  package:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: macos-26
    concurrency:
      group: mac-release-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Use Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Verify source and iOS build
        run: |
          ./scripts/verify.sh
          xcodebuild -quiet -project Plainwire.xcodeproj -scheme Plainwire \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build universal Mac archive
        run: ./scripts/package-macos.sh "v${RELEASE_TAG#v}" "$RUNNER_TEMP/plainwire-release"

      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/plainwire-release/Plainwire-macOS-universal.zip"
          sums="$RUNNER_TEMP/plainwire-release/SHA256SUMS.txt"
          installer="$RUNNER_TEMP/plainwire-release/install-macos.sh"
          updater="$RUNNER_TEMP/plainwire-release/update-macos.sh"
          swap="$RUNNER_TEMP/plainwire-release/plainwire-swap"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "$archive" "$sums" "$installer" "$updater" "$swap" \
              --title "$RELEASE_TAG" --generate-notes --verify-tag
          else
            for asset in "$archive" "$sums" "$installer" "$updater" "$swap"; do
              name=$(basename "$asset")
              if ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
                | grep -Fxq "$name"; then
                gh release upload "$RELEASE_TAG" "$asset"
              fi
            done
          fi
