name: Native UI diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Sources/**'
      - 'Tests/Manual/**'
      - 'scripts/verify-calling.sh'
      - '.github/workflows/native-ui.yml'
  pull_request:
    paths:
      - 'App/**'
      - 'Sources/**'
      - 'Tests/Manual/**'
      - 'scripts/verify-calling.sh'
      - '.github/workflows/native-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ui:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Use Xcode 26.6
        if: matrix.runner == 'macos-26'
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Native UI checks
        run: script -q /dev/null ./scripts/verify-calling.sh
      - name: Native process logs
        if: failure()
        run: /usr/bin/log show --last 5m --style compact --predicate 'process == "PlainwireSmoke"' | tail -200
      - name: Save layout captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-layouts-${{ matrix.runner }}
          path: |
            /tmp/plainwire-navigation-*.png
            /tmp/plainwire-window-search-*.png
          if-no-files-found: ignore
          retention-days: 7
