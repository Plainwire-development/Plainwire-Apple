name: Apple client checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Verify core and repository
        run: ./scripts/verify.sh

  xcode-26-intel:
    name: Xcode 26.6 · macOS 26 Intel
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Core tests
        run: swift test
      - name: macOS Debug + Release
        run: |
          for configuration in Debug Release; do
            xcodebuild -project Plainwire.xcodeproj -scheme Plainwire \
              -configuration "$configuration" \
              -destination 'generic/platform=macOS' \
              ARCHS=x86_64 CODE_SIGNING_ALLOWED=NO build
          done
      - name: iOS Simulator Debug
        run: >-
          xcodebuild
          -project Plainwire.xcodeproj
          -scheme Plainwire
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  xcode-27-apple-silicon:
    name: Xcode 27 · macOS 27 Apple Silicon
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Core tests
        run: swift test
      - name: macOS Debug + Release
        run: |
          for configuration in Debug Release; do
            xcodebuild -project Plainwire.xcodeproj -scheme Plainwire \
              -configuration "$configuration" \
              -destination 'generic/platform=macOS' \
              CODE_SIGNING_ALLOWED=NO build
          done
      - name: iOS Simulator Debug + Release
        run: |
          for configuration in Debug Release; do
            xcodebuild -project Plainwire.xcodeproj -scheme Plainwire \
              -configuration "$configuration" \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO build
          done
